<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Recuperar contraseña</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#16493A}a:hover{color:#0F3A2D}
input::placeholder{color:#8A958F}
.rc-in{animation:rcIn .35s cubic-bezier(.2,.9,.3,1) both}
@keyframes rcIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rc-pop{animation:rcPop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes rcPop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
.mo-press button:not(:disabled),.mo-press a{transition:transform .12s ease}
.mo-press button:not(:disabled):active,.mo-press a:active{transform:scale(.97)}
.tk{animation:tkPop .4s cubic-bezier(.2,1.6,.4,1) both}
.tk path{stroke-dasharray:24;stroke-dashoffset:24;animation:tkDraw .4s .08s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes tkDraw{to{stroke-dashoffset:0}}
@keyframes tkPop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.gb{transform-origin:left center;animation:gbX .7s cubic-bezier(.2,.9,.3,1) both}
@keyframes gbX{from{transform:scaleX(0)}}
.gbY{transform-origin:center bottom;animation:gbY .6s cubic-bezier(.2,.9,.3,1) both}
@keyframes gbY{from{transform:scaleY(0)}}
.cas>*{animation:casIn .32s cubic-bezier(.2,.9,.3,1) both}
.cas>*:nth-child(2){animation-delay:.04s}.cas>*:nth-child(3){animation-delay:.08s}.cas>*:nth-child(4){animation-delay:.12s}.cas>*:nth-child(5){animation-delay:.16s}.cas>*:nth-child(6){animation-delay:.2s}.cas>*:nth-child(n+7){animation-delay:.24s}
@keyframes casIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}.tk path{stroke-dashoffset:0!important}}
</style>
</helmet>
<div class="mo-press" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F6F7F5; font-family: Manrope, system-ui, sans-serif; color: #0E1A15; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 18px">
  <a href="Ingresar.dc.html" aria-label="Volver a ingresar" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none">
    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E1A15" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
  </a>

  <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
    <div class="rc-in" style="display: flex; flex-direction: column; gap: 18px; flex: 1">
      <div style="width: 56px; height: 56px; border-radius: 18px; background: #DDEEE3; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#16493A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11h12v9H6zM8.5 11V8a3.5 3.5 0 0 1 7 0v3"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.02em">Recupera tu contraseña</h1>
        <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #4E5B55">Escribe el correo de tu cuenta y te enviamos un enlace para elegir una nueva.</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="rc-mail" style="font-size: 13px; font-weight: 700; color: #33403A">Correo</label>
        <input id="rc-mail" type="email" placeholder="nombre@correo.com" value="{{ mail }}" onInput="{{ onMail }}" style="height: 52px; border-radius: 14px; border: 1.5px solid {{ mailBorder }}; background: #FFFFFF; padding: 0 16px; font: inherit; font-size: 15px; font-weight: 600; color: #0E1A15; outline-color: #16493A">
        <sc-if value="{{ error }}" hint-placeholder-val="{{ false }}"><div style="font-size: 13px; font-weight: 700; color: #D93025">{{ error }}</div></sc-if>
      </div>
      <div style="flex: 1"></div>
      <button type="button" onClick="{{ send }}" style="height: 54px; border-radius: 14px; border: none; background: #16493A; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 800; cursor: pointer">Enviarme el enlace</button>
      <a href="Ingresar.dc.html" style="text-align: center; font-size: 14px; font-weight: 800; text-decoration: none; min-height: 44px; display: flex; align-items: center; justify-content: center">Volver a ingresar</a>
    </div>
  </sc-if>

  <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; flex: 1">
      <div style="flex: 1"></div>
      <div class="rc-pop" style="width: 88px; height: 88px; border-radius: 50%; background: #DDEEE3; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#16493A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18v12H3zM3 7l9 6 9-6"></path></svg>
      </div>
      <h1 class="rc-in" style="margin: 0; font-size: 24px; font-weight: 800">Revisa tu correo</h1>
      <p class="rc-in" style="margin: 0; font-size: 15px; line-height: 1.5; color: #4E5B55">{{ sentText }}</p>
      <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #6B7771">¿No te llegó? Revisa la carpeta de spam o pide otro enlace.</p>
      <div style="flex: 1"></div>
      <a href="Ingresar.dc.html" style="width: 100%; height: 54px; border-radius: 14px; background: #16493A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 16px; font-weight: 800">Volver a ingresar</a>
      <button type="button" onClick="{{ again }}" style="width: 100%; height: 50px; border-radius: 14px; border: 1.5px solid #E1E5E1; background: #FFFFFF; color: #0E1A15; font: inherit; font-size: 15px; font-weight: 800; cursor: pointer">Enviar otro enlace</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mail: '', sent: false, error: '' }; }
  renderVals() {
    const s = this.state;
    return {
      mail: s.mail, notSent: !s.sent, sent: s.sent, error: s.error,
      mailBorder: s.error ? '#D93025' : '#E1E5E1',
      onMail: (e) => this.setState({ mail: e.target.value, error: '' }),
      send: () => { if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s.mail.trim())) { this.setState({ error: 'Escribe un correo válido.' }); return; } this.setState({ sent: true }); },
      sentText: 'Si ' + (s.mail.trim() || 'ese correo') + ' tiene una cuenta, te enviamos un enlace para elegir una contraseña nueva. Vence en 1 hora.',
      again: () => this.setState({ sent: false })
    };
  }
}
</script>
</body>
</html>
