<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Crear cuenta</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#16493A}a:hover{color:#0F3A2D}
input::placeholder{color:#8A958F}
.mo-press button:not(:disabled),.mo-press a{transition:transform .12s ease}
.mo-press button:not(:disabled):active,.mo-press a:active{transform:scale(.97)}
.tk{animation:tkPop .4s cubic-bezier(.2,1.6,.4,1) both}
.tk path{stroke-dasharray:24;stroke-dashoffset:24;animation:tkDraw .4s .08s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes tkDraw{to{stroke-dashoffset:0}}
@keyframes tkPop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.gb{transform-origin:left center;animation:gbX .7s cubic-bezier(.2,.9,.3,1) both}
@keyframes gbX{from{transform:scaleX(0)}}
.gbY{transform-origin:center bottom;animation:gbY .6s cubic-bezier(.2,.9,.3,1) both}
@keyframes gbY{from{transform:scaleY(0)}}
.cas>*{animation:casIn .32s cubic-bezier(.2,.9,.3,1) both}
.cas>*:nth-child(2){animation-delay:.04s}.cas>*:nth-child(3){animation-delay:.08s}.cas>*:nth-child(4){animation-delay:.12s}.cas>*:nth-child(5){animation-delay:.16s}.cas>*:nth-child(6){animation-delay:.2s}.cas>*:nth-child(n+7){animation-delay:.24s}
@keyframes casIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}.tk path{stroke-dashoffset:0!important}}
</style>
</helmet>
<div class="mo-press" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F6F7F5; font-family: Manrope, system-ui, sans-serif; color: #0E1A15; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 14px">
  <div style="display: flex; flex-direction: column; gap: 6px; padding-top: 12px">
    <h1 style="margin: 0; font-size: 28px; line-height: 1.15; font-weight: 800; letter-spacing: -.02em">Crea tu cuenta</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.45; color: #4E5B55">Gratis y sin tarjeta.</p>
  </div>

  <div style="display: flex; flex-wrap: wrap; gap: 6px">
    <sc-for list="{{ perks }}" as="p" hint-placeholder-count="3">
      <span style="height: 30px; padding: 0 10px; border-radius: 999px; background: #DDEEE3; color: #0F3A2D; font-size: 12px; font-weight: 800; display: flex; align-items: center; gap: 6px">
        <svg class="tk" aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>{{ p }}</span>
    </sc-for>
  </div>

  <a href="Bienvenida.dc.html" style="height: 52px; border-radius: 14px; border: 1.5px solid #E1E5E1; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; color: #0E1A15; font-size: 15px; font-weight: 700; background: #FFFFFF; flex: none">
    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.2C12.5 13.6 17.8 9.5 24 9.5z"></path><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.8c4.3-4 6.9-9.9 6.9-17.2z"></path><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.2C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.8-6.1z"></path><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.8c-2.1 1.4-4.8 2.3-8.5 2.3-6.2 0-11.5-4.1-13.4-9.8l-7.9 6.1C6.6 42.6 14.6 48 24 48z"></path></svg>
    Continuar con Google
  </a>


  <div style="display: flex; align-items: center; gap: 12px; font-size: 13px; font-weight: 600; color: #6B7771">
    <div style="flex: 1; height: 1px; background: #E1E5E1"></div>o con tu correo<div style="flex: 1; height: 1px; background: #E1E5E1"></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <label for="rg-name" style="font-size: 13px; font-weight: 700; color: #33403A">Nombre</label>
    <input id="rg-name" type="text" placeholder="Cómo te llamamos" style="height: 50px; border-radius: 14px; border: 1.5px solid #E1E5E1; background: #FFFFFF; padding: 0 16px; font: inherit; font-size: 15px; font-weight: 600; color: #0E1A15; outline-color: #16493A">
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px">
    <label for="rg-mail" style="font-size: 13px; font-weight: 700; color: #33403A">Correo</label>
    <input id="rg-mail" type="email" placeholder="tucorreo@ejemplo.com" style="height: 50px; border-radius: 14px; border: 1.5px solid #E1E5E1; background: #FFFFFF; padding: 0 16px; font: inherit; font-size: 15px; font-weight: 600; color: #0E1A15; outline-color: #16493A">
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px">
    <label for="rg-pass" style="font-size: 13px; font-weight: 700; color: #33403A">Contraseña</label>
    <input id="rg-pass" type="password" placeholder="Al menos 8 caracteres" onInput="{{ onPass }}" style="height: 50px; border-radius: 14px; border: 1.5px solid #E1E5E1; background: #FFFFFF; padding: 0 16px; font: inherit; font-size: 15px; font-weight: 600; color: #0E1A15; outline-color: #16493A">
    <div style="display: flex; align-items: center; gap: 10px; padding-top: 2px">
      <div style="flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
        <sc-for list="{{ bars }}" as="b" hint-placeholder-count="4">
          <div style="height: 5px; border-radius: 5px; background: {{ b.color }}"></div>
        </sc-for>
      </div>
      <div style="font-size: 12px; font-weight: 700; color: #4E5B55; white-space: nowrap; text-align: right">{{ strengthLabel }}</div>
    </div>
  </div>

  <label style="display: flex; align-items: flex-start; gap: 10px; font-size: 13px; line-height: 1.45; font-weight: 600; color: #33403A">
    <input type="checkbox" style="width: 20px; height: 20px; accent-color: #16493A; margin: 0; flex: none">
    <span>Acepto los <a href="#terminos" style="font-weight: 800">términos y condiciones</a> y la <a href="#privacidad" style="font-weight: 800">política de privacidad</a></span>
  </label>

  <div style="flex: 1"></div>
  <a href="Bienvenida.dc.html" style="height: 54px; border-radius: 14px; background: #16493A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 16px; font-weight: 800; flex: none">Crear cuenta</a>
  <p style="margin: 0; text-align: center; font-size: 14px; font-weight: 600; color: #4E5B55">¿Ya tienes cuenta? <a href="Ingresar.dc.html" style="font-weight: 800; text-decoration: none">Inicia sesión</a></p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { score: 0, typed: false }; }
  renderVals() {
    const s = this.state.score;
    const colors = ['#C5221F', '#C96A00', '#4A8669', '#16493A'];
    const labels = ['Muy débil', 'Débil', 'Buena', 'Muy segura'];
    return {
      perks: ['Gratis', 'Sin tarjeta', 'Sin clave bancaria'],
      onPass: (e) => {
        const v = e.target.value || '';
        let n = 0;
        if (v.length >= 8) n++;
        if (/[A-Z]/.test(v) && /[a-z]/.test(v)) n++;
        if (/\d/.test(v)) n++;
        if (/[^A-Za-z0-9]/.test(v) || v.length >= 14) n++;
        this.setState({ score: n, typed: v.length > 0 });
      },
      bars: [0, 1, 2, 3].map((i) => ({ color: this.state.typed && i < Math.max(1, s) ? colors[Math.max(0, s - 1)] : '#E1E5E1' })),
      strengthLabel: this.state.typed ? labels[Math.max(0, s - 1)] : 'Usa letras y números'
    };
  }
}
</script>
</body>
</html>
