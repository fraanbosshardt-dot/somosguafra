# Revisa tipos y pruebas en cada cambio; Vercel verifica la compilación durante su despliegue.
name: Pruebas
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: local-ci-fixture
          POSTGRES_DB: guafra_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U audit -d guafra_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://audit:local-ci-fixture@127.0.0.1:5432/guafra_test
      TEST_DATABASE_URL: postgresql://audit:local-ci-fixture@127.0.0.1:5432/guafra_test
      APP_URL: http://127.0.0.1:3107
      AUTH_SECRET: ci-only-synthetic-secret-not-a-production-key
      MP_ACCESS_TOKEN: ""
      MP_WEBHOOK_SECRET: ""
      RESEND_API_KEY: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/check-build.mjs
