name: Salud de producción
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Enviar prueba de alerta: falla deliberadamente sin consultar ni modificar producción'
        type: boolean
        default: false
      diagnose_provider:
        description: 'Consultar diagnóstico de Mercado Pago: solo GET, sin procesar pagos ni imprimir datos privados'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: salud-produccion
  cancel-in-progress: false
jobs:
  disponibilidad:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.test_notification }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      OPERATIONS_SECRET: ${{ secrets.OPERATIONS_MONITOR_SECRET }}
      DIAGNOSE_PROVIDER: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnose_provider }}
    steps:
      - name: Comprobar sitio, ingreso y base de datos
        shell: bash
        run: |
          set -euo pipefail
          if [ "$DIAGNOSE_PROVIDER" = "true" ]; then
            test -n "$OPERATIONS_SECRET"
            curl --fail --silent --show-error --max-time 30 \
              -H "Authorization: Bearer $OPERATIONS_SECRET" \
              "https://somosguafra.com/api/health/operaciones?diagnostic=provider" -o /tmp/provider-diagnostic
            python3 -c 'import json; d=json.load(open("/tmp/provider-diagnostic")); print(json.dumps(d)); assert isinstance(d.get("checks"),list)'
            exit 0
          fi
          for path in / /ingresar /api/health; do
            curl --fail --silent --show-error --location --max-time 20 --retry 2 --retry-delay 5 "https://somosguafra.com${path}" -o /tmp/health-response
            if [ "$path" = "/api/health" ]; then
              python3 -c 'import json; assert json.load(open("/tmp/health-response"))["ok"] is True'
            fi
          done
          if [ -n "$OPERATIONS_SECRET" ]; then
            curl --fail --silent --show-error --max-time 20 --retry 1 \
              -H "Authorization: Bearer $OPERATIONS_SECRET" \
              "https://somosguafra.com/api/health/operaciones" -o /tmp/operations-response
            python3 -c 'import json; assert json.load(open("/tmp/operations-response"))["ok"] is True'
          else
            echo "::error::Falta OPERATIONS_MONITOR_SECRET. El monitoreo interno no está conectado."
            exit 1
          fi
      - name: Indicar dónde revisar un fallo
        if: failure()
        run: echo "::error::Revisar Panel interno → Sistema y seguridad / Actividad. Este control solo consulta; no ejecuta cobros ni bajas. Los logs públicos no incluyen el detalle financiero."
  prueba-aviso:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_notification }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: PRUEBA de aviso, no incidente real
        run: |
          echo "::error::PRUEBA AUTORIZADA DE NOTIFICACIONES. No se consultó ni modificó producción."
          exit 1
